<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 400px;
        }

        .campo {margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #0070f3; color: white; border: none; cursor: pointer; }
        #resultado { margin-top: 20px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <h2> Calculadora via API</h2>

    <div class="campo">
        <label for="numero1">Número 1:</label>
        <input type="number" id="numero1" placeholder="Digite o primeiro número">
    </div>

    <div class="campo">
        <label for="numero2">Número 2:</label>
        <input type="number" id="numero2" placeholder="Digite o segundo número">
    </div>

    <button onclick="somar()">Somar via API</button>
    <div id="resultado"></div>

    <script src="script.js"></script>
</body>
</html>
